name: Build APK

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: write

# Never cancel a running build because of a newer push: every push to main should yield its own release.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  TUBE_BUILD_NUMBER: ${{ github.run_number }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # gradle/gradle-daemon-jvm.properties pins the build daemon to JetBrains JDK 25.
      - uses: actions/setup-java@v4
        with:
          distribution: jetbrains
          java-version: 25

      # Uses the committed Gradle wrapper (9.6) and caches dependencies.
      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore

      - name: Name the APK
        id: apk
        run: |
          VERSION="0.1.${{ github.run_number }}"
          cp app/build/outputs/apk/debug/app-debug.apk "tube-${VERSION}.apk"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "file=tube-${VERSION}.apk" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: tube-apk
          path: ${{ steps.apk.outputs.file }}

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.apk.outputs.version }}" "${{ steps.apk.outputs.file }}" \
            --target "${{ github.sha }}" \
            --title "Tube ${{ steps.apk.outputs.version }}" \
            --generate-notes \
            --latest
